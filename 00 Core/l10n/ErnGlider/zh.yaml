volumeName: "音量"
volumeDescription: "音效音量系数。"
chimTrickyName: "CHIM Tricky"
chimTrickyDescription: "滑行时使用自定义 HUD。"

GlideKeyName: "切换滑翔按键"
SurfKeyName: "切换滑行按键"

EnableGlideJumpControlName: "滑翔跳跃控制"
EnableGlideJumpControlDescription: "使用方向输入跳跃时切换滑翔。禁用后将取消通过跳跃键切换；你需要单独绑定滑翔按键。"
EnableSurfJumpControlName: "滑行跳跃控制"
EnableSurfJumpControlDescription: "使用方向输入跳跃时切换滑行。禁用后将取消通过跳跃键切换；你需要单独绑定滑行按键。"
