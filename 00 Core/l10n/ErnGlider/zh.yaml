name: "滑翔翼"
description: "既然可以滑翔，何必步行？"

mainSettings: "通用"
gliderSettings: "滑翔"
gliderDescription: "在双手空闲且既不向前也不向后移动时进行二段跳，即可优雅地在空中滑翔。
滑翔翼及其升级只能通过完成任务获得。"
surfSettings: "盾牌滑行"
surfDescription: "在双手空闲且向后移动时进行二段跳，即可踩着盾牌沿斜坡滑行。"
enableQuestName: "启用任务"
enableQuestDescription: "禁用后将停用滑翔翼任务。滑翔翼的品质将根据你的杂技技能解锁。"

enableName: "启用"
enableDescription: "启用或禁用此功能。"
debugName: "调试模式"
fatigueCostName: "滑翔疲劳消耗"
fatigueCostDescription: "滑翔时每秒的疲劳消耗。如果疲劳耗尽，你会坠落。滑翔期间会停止自然疲劳恢复。"
conditionCostName: "盾牌滑行耐久消耗"
conditionCostDescription: "盾牌滑行时每秒造成的盾牌耐久损耗。"
