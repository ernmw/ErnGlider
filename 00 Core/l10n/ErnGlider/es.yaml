name: "Planeador"
description: "¿Por qué caminar cuando puedes planear?"

mainSettings: "Compartido"
gliderSettings: "Planeo"
gliderDescription: "Planea con elegancia por el aire haciendo un doble salto mientras tienes las manos libres y no te mueves ni hacia delante ni hacia atrás.
Los planeadores y sus mejoras solo están disponibles al completar una misión."
surfSettings: "Surf con escudo"
surfDescription: "Deslízate por las pendientes sobre tu escudo haciendo un doble salto mientras tienes las manos libres y te mueves hacia atrás."
enableQuestName: "Activar misión"
enableQuestDescription: "Desactívalo para desactivar la misión del Planeador. La calidad de tu Planeador se desbloqueará según tu habilidad de Acrobacia."

enableName: "Activar"
enableDescription: "Activa o desactiva esta función."
debugName: "Modo depuración"
fatigueCostName: "Coste de fatiga del Planeador"
fatigueCostDescription: "Coste de fatiga por segundo mientras planeas. Si te quedas sin fatiga, caes. La regeneración natural de fatiga se detiene mientras planeas."
conditionCostName: "Coste de condición del surf con escudo"
conditionCostDescription: "Daño de condición del escudo por segundo mientras haces surf."
fallCostName: "Factor de coste de condición por caída"
fallCostDescription: "Influye en cuánto daño recibe tu escudo si caes desde demasiada altura. Los escudos más ligeros reciben menos daño por caída."

shadersName: "Activar sombreadores"
shadersDescription: "Activa o desactiva los efectos de sombreado."
deadzoneName: "Zona muerta del mando"
deadzoneDescription: "Ajusta la zona muerta para determinar si te mueves hacia delante o hacia atrás. Solo es útil para los sticks analógicos."
volumeName: "Volumen"
volumeDescription: "Factor de volumen de los efectos de sonido."
chimTrickyName: "CHIM Tricky"
chimTrickyDescription: "Usa un HUD personalizado mientras haces surf."

GlideKeyName: "Botón de alternar planeo"
SurfKeyName: "Botón de alternar surf"

EnableGlideJumpControlName: "Control de salto de planeo"
EnableGlideJumpControlDescription: "Activa o desactiva el planeo al saltar con una dirección. Desactívalo para eliminar la alternancia con el botón de salto; tendrás que asignar el botón de planeo por separado."
EnableSurfJumpControlName: "Control de salto de surf"
EnableSurfJumpControlDescription: "Activa o desactiva el surf al saltar con una dirección. Desactívalo para eliminar la alternancia con el botón de salto; tendrás que asignar el botón de surf por separado."
onlyUseEquippedShieldName: "Solo escudo equipado"
onlyUseEquippedShieldDescription: "Desactívalo para usar el escudo con mayor durabilidad de tu inventario si no tienes ningún escudo equipado."
shieldBroke: "¡{shield} se rompió!"


move360Warning: "El Planeador no funcionará correctamente porque has activado el ajuste de cámara «Mover 360»."

